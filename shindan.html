<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>ピザ性格診断 | コリコリゲームズ</title>
    <meta name="description" content="10問の質問に答えて、あなたにぴったりのピザを診断！">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="index.css?v=2" rel="stylesheet">
    <link href="shindan.css?v=2" rel="stylesheet">
    <link rel="stylesheet" href="https://use.typekit.net/bwr6ido.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="theme.css?v=1" rel="stylesheet">
</head>

  <body>
    <header class="header">
      <div class="header-inner">
        <nav class="header-site-menu">
          <ul class="menu">
            <li><a href="./index.html">ホーム</a></li>
            <li><a href="./ourteam.html">役員紹介</a></li>
            <li><a href="https://www.instagram.com/korikori_games?igsh=MWYxY3AwNjAxcmV0Mw==">Instagrum</a></li>
            <li><a href=".https://note.com/alive_sedum6502/portal">ブログ</a></li>
            <li><a href="./shindan.html">ピザ診断</a></li>

            <li><a href="https://www.instagram.com/korikori_games?igsh=MWYxY3AwNjAxcmV0Mw==">お問い合わせ</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main">
      <section class="shindan-wrap">
        <div class="shindan-header">
          <p class="shindan-label">PIZZA PERSONALITY TEST</p>
          <h1 class="shindan-title">あなたはどのピザ？</h1>
          <p class="shindan-desc">10問の質問に答えて、あなたにぴったりのピザを診断しよう！</p>
        </div>

        <!-- スタート画面 -->
        <div id="start-screen" class="screen active">
          <div class="pizza-emoji-row">🍕🍕🍕</div>
          <p class="start-text">全10問。直感で答えてね！</p>
          <button class="shindan-btn" id="start-btn">診断スタート！</button>
        </div>

        <!-- 質問画面 -->
        <div id="quiz-screen" class="screen">
          <div class="progress-wrap">
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p class="progress-text"><span id="current-q">1</span> / 10</p>
          </div>
          <div class="question-card">
            <p class="question-text" id="question-text"></p>
            <div class="choices" id="choices"></div>
          </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="screen">
          <p class="result-label">診断結果</p>
          <div class="result-card">
            <p class="result-num" id="result-num"></p>
            <div class="result-emoji" id="result-emoji"></div>
            <h2 class="result-pizza" id="result-pizza"></h2>
            <p class="result-catch" id="result-catch"></p>
            <p class="result-desc" id="result-desc"></p>
            <div class="result-tags" id="result-tags"></div>
          </div>
          <div class="result-btns">
            <button class="shindan-btn" id="retry-btn">もう一度診断する</button>
            <a class="shindan-btn btn-outline" href="./index.html">ホームへ</a>
          </div>
        </div>

      </section>
    </main>

    <footer class="footer">
      <nav class="header-site-menu">
        <ul class="menu">
          <li><a href="./index.html">ホーム</a></li>
          <li><a href="./ourteam.html">役員紹介</a></li>
          <li><a href="https://www.instagram.com/korikori_games?igsh=MWYxY3AwNjAxcmV0Mw==">Instagrum</a></li>
          <li><a href=".https://note.com/alive_sedum6502/portal">ブログ</a></li>
          <li><a href="./shindan.html">ピザ診断</a></li>

          <li><a href="https://www.instagram.com/korikori_games?igsh=MWYxY3AwNjAxcmV0Mw==">お問い合わせ</a></li>
        </ul>
      </nav>
      <p class="copyright"><small>&copy;コリコリゲームズ</small></p>
    </footer>

    <script src="shindan.js"></script>
  </body>
</html>
